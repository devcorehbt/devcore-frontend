name: 🐛 Bug Report
description: Reportar um comportamento incorreto
title: 'fix: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Obrigado por reportar! Preencha os campos abaixo para ajudar a reproduzir.
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Descrição clara do bug e do comportamento esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Vá para '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - apps/web
        - packages/ui
        - tooling/CI
        - outro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: 'Navegador, OS, versão do Bun...'
